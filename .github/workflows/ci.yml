# CI corre EL MISMO gate que el humano y que el agente. Si CI verifica algo
# distinto de lo que verifica el desarrollador, una de las dos señales miente.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # El gate en las TRES plataformas donde vive un equipo. No es lujo: el arnés se predica
  # portable, y "portable" sin una corrida en Windows es una suposición. La matriz es el
  # mecanismo — el único comando que puede demostrar que el gate corre allá es el gate.
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Sin `npm ci`: el arnés no tiene dependencias a propósito (sólo node).
      - name: gate
        run: npm run gate

  # El banco completo, incluido el gate de cada repo portado: ~75s, así que no va en el gate
  # del desarrollador (ahí corre el modo rápido, sin el gate del destino).
  banco-completo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: banco de perfiles con el gate del repo portado
        run: node scripts/harness-bench.mjs --with-gate

  # La versión fuerte de «el cambio entra con su prueba»: las pruebas del PR tienen que FALLAR
  # sobre la base, sin el cambio de producción (`xp.testFirst.verifyRed`). Corre la suite sobre
  # otro árbol, así que va acá y no en el gate de cada commit: a la derecha del ciclo, donde el
  # costo se paga una vez por PR. `fetch-depth: 0` porque necesita el merge-base con la base.
  rojo-sin-el-cambio:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: las pruebas nuevas fallan sin el cambio
        run: node scripts/cycle-check.mjs --verify-red origin/${{ github.base_ref }}
